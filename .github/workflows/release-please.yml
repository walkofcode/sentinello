# release-please — automated SemVer release engineering.
#
# Flow:
#   1. Every push to `main` runs release-please-action.
#   2. The action reads conventional-commit subjects since the last release and maintains
#      a single self-updating PR titled "release: vX.Y.Z" which bumps root package.json
#      and appends entries to CHANGELOG.md.
#   3. When that PR is merged, release-please creates the git tag (vX.Y.Z) AND a GitHub
#      Release whose body is the changelog excerpt.
#   4. The dispatch jobs below then fire .github/workflows/publish-image.yml and
#      .github/workflows/publish-npm.yml via workflow_dispatch against the new tag.
#      We chain via workflow_dispatch (rather than the natural `push: tags: v*` trigger
#      on those workflows) because tags pushed by GITHUB_TOKEN do NOT trigger downstream
#      workflows — workflow_dispatch and repository_dispatch are the two documented
#      exceptions to that rule. This keeps the whole chain on the default GITHUB_TOKEN —
#      no PAT and no GitHub App required.
#
#      Both publishes need their own dispatch job. publish-npm.yml was added after this
#      chaining was set up and never got one, so its `push: tags` trigger sat dead: 3.0.0
#      tagged, published a Docker image, and put nothing on npm until someone dispatched it
#      by hand. Anything added here later that publishes off a tag needs a job below too —
#      the tag trigger alone will look correct and never fire.
#
#   5. dispatch-release-pr-ci fires .github/workflows/ci.yml against the release PR's own branch,
#      for the SAME reason and with the same mechanism. The release PR is opened by GITHUB_TOKEN,
#      so ci.yml's `pull_request` trigger creates a run record that GitHub never dispatches: zero
#      jobs, conclusion `failure`, and the unhelpful message "This run likely failed because of a
#      workflow file issue". That red X is not a test failure and never was — it is a run that did
#      not happen. Every release from 3.0.1 to 3.5.1 merged with it showing, and the only green one
#      in the history (2026-08-03) was a human clicking re-run the next morning, which shows up in
#      the API as run_attempt 2 with triggering_actor a real user rather than the bot.
#
#      The dispatched run is a real gate, but it does NOT attach to the PR as a status check —
#      workflow_dispatch runs never do. So the phantom red X stays. Read the dispatched run in the
#      Actions tab, not the check on the PR. Removing that red X entirely needs release-please to
#      author its PR with a PAT or GitHub App token instead of GITHUB_TOKEN, which is the trade this
#      repo has deliberately not made — see the "No secrets required" note below.
#
#      Cost: this doubles CI on every push to main, since the release branch is main plus a version
#      bump. That redundancy is the point — a test that compares package.json#version against
#      packages/core/src/releases.ts can only pass on the release branch, never on main.
#
# NOTE: when folding curated release notes (packages/core/src/releases.ts) into an OPEN release PR,
# commit them as `docs(...)`, NEVER `chore(...)`. `chore` is hidden:true in release-please-config.json,
# so a chore-only delta yields an identical changelog and release-please leaves the open PR stale (it
# only re-pushes the PR branch when its generated CHANGELOG/package.json/manifest would change). `docs`
# adds a Documentation line, forcing a rebase of the PR onto the new main so the notes show up in it.
# Neither type changes the computed bump; the notes ship either way (the tag is cut from main HEAD),
# but `docs` keeps the PR an accurate preview.
#
# No secrets required — uses the built-in GITHUB_TOKEN with elevated permissions below.
# Manual override: workflow_dispatch re-runs the action without waiting for a push.

name: release-please

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            prs_created: ${{ steps.release.outputs.prs_created }}
            pr: ${{ steps.release.outputs.pr }}
        steps:
            - name: Run release-please
              id: release
              uses: googleapis/release-please-action@v5
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
                  token: ${{ secrets.GITHUB_TOKEN }}

    dispatch-image-publish:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - name: Dispatch publish-image for the new tag
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh workflow run publish-image.yml \
                      --repo ${{ github.repository }} \
                      --ref ${{ needs.release-please.outputs.tag_name }} \
                      -f push=true

    # The npm half of the same chain. Separate from dispatch-image-publish rather than two steps in one
    # job so a registry-side failure on one publish never withholds the other.
    dispatch-npm-publish:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - name: Dispatch publish-npm for the new tag
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh workflow run publish-npm.yml \
                      --repo ${{ github.repository }} \
                      --ref ${{ needs.release-please.outputs.tag_name }} \
                      -f publish=true

    # The release PR's own gate. `prs_created` is true when release-please opened OR updated the PR,
    # which is exactly when its branch has new content worth testing. Guarded on `pr` being non-empty
    # too: fromJSON below would fail the job outright on an unset output, and the docs describe `pr`
    # as unset in cases that do not line up cleanly with prs_created.
    dispatch-release-pr-ci:
        needs: release-please
        if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.pr != ''
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - name: Dispatch ci for the release PR branch
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
              run: |
                  echo "Dispatching ci.yml against release PR branch: $BRANCH"
                  gh workflow run ci.yml \
                      --repo ${{ github.repository }} \
                      --ref "$BRANCH"
