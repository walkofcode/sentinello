# Build and publish the Sentinello CLI to npm as `sentinello`.
#
# Triggers:
#   - Push of a `v*` tag (e.g. `v3.0.0`) → publishes sentinello@X.Y.Z, alongside publish-image.yml
#     which publishes the container at the same tag. One tag, one version, everywhere.
#   - workflow_dispatch → dry run by default (packs and inspects without publishing), so the
#     packaging can be smoke-tested without burning a version.
#
# Versioning — why nothing here reads apps/cli/package.json#version:
#   The canonical version is the monorepo ROOT package.json, maintained by release-please. Every
#   workspace package stays pinned at 0.1.0 forever (they are internal and never published), and this
#   workflow stamps the released version onto the CLI package immediately before publishing. That keeps
#   the npm version and the Docker tag identical by construction rather than by remembering to bump a
#   second file, and it means release-please needs no second package registered.
#
# Authentication — npm trusted publishing (OIDC), with a one-release token bootstrap:
#   Steady state is no secret at all. npm mints a short-lived credential from this workflow's OIDC
#   identity, which also produces a provenance attestation linking the tarball to this exact commit
#   and workflow. A long-lived automation token is exactly the kind of credential a supply-chain
#   attack wants; not having one is the point.
#
#   The exception is the very first publish, because npm cannot CREATE a package over OIDC. A trusted
#   publisher is configured on the package's settings page, and that page does not exist until
#   something has been published — npm/cli#8544, open since 2025-09 and still open as of 2026-07.
#   PyPI lets you pre-register a publisher for a name that does not exist yet; npm does not.
#
#   That restriction is on package CREATION, not on publishing from CI, so the bootstrap does not
#   have to happen on someone's laptop. A granular token in NPM_TOKEN creates the package from this
#   workflow, and provenance still works: it depends on `id-token: write` plus a supported CI runner,
#   not on how the publish authenticated. So the first release is attested like every other one.
#
#   BOOTSTRAP (once, ever):
#     1. npmjs.com → Access Tokens → Granular. Packages and scopes: "Read and write" / All packages
#        (the name does not exist yet, so it cannot be selected individually). Set the shortest
#        expiry offered and no IP allowlist. Add it as the repo secret NPM_TOKEN.
#     2. Let the release go out normally — merge the release PR, release-please tags, this workflow
#        runs and finds NPM_TOKEN, so it authenticates with the token and creates the package.
#        (Or trigger it by hand first with workflow_dispatch + publish: true.)
#     3. npmjs.com → sentinello → Settings → Trusted Publisher, add:
#          repository: walkofcode/sentinello   workflow: .github/workflows/publish-npm.yml
#     4. DELETE the NPM_TOKEN secret and revoke the token on npmjs.com. With no secret present the
#        auth step below is a no-op and npm falls back to OIDC, which is the steady state. Leaving
#        the token in place would keep a publish-capable credential around for no reason.
#
#   Until step 4 the token wins over OIDC; after it, there is nothing to win with.
#
#   Also pending until the package exists: README.md's "Just want the answer, right now?" section
#   carries a "Coming with 3.0" callout, because `npx sentinello` 404s until then. Delete that
#   callout — and ship the homepage CLI section — in the same release, so they cannot drift apart.

name: publish-npm

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            publish:
                description: 'Actually publish to npm (false = pack and inspect only)'
                type: boolean
                default: false

permissions:
    contents: read
    # Required for trusted publishing and provenance attestation.
    id-token: write

jobs:
    publish:
        name: publish to npm
        runs-on: ubuntu-latest
        # Lifted to the job so the bootstrap steps can test for the secret. `secrets` is not available
        # in a step-level `if`, but `env` is, and an unset secret arrives here as an empty string.
        env:
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            # Deliberately no `registry-url`. It exists to write an .npmrc containing
            # `_authToken=${NODE_AUTH_TOKEN}` and to point NPM_CONFIG_USERCONFIG at it — which in the
            # steady state would leave npm holding an EMPTY token rather than no token, and an empty
            # credential is not the same as absent when npm decides whether to reach for OIDC.
            # registry.npmjs.org is the default anyway, so the only thing dropping it costs is an auth
            # template we do not want. The bootstrap step below writes real credentials when they exist.
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            # Trusted publishing requires a recent npm; the version bundled with Node 24 predates it.
            - name: Update npm
              run: npm install -g npm@latest

            # Bootstrap only — see the Authentication note at the top. Present for the first release,
            # deleted immediately after the trusted publisher is configured. `npm config set` writes to
            # ~/.npmrc; the value is a masked secret, so it never reaches the log.
            - name: Authenticate with the bootstrap token
              if: env.NPM_TOKEN != ''
              run: npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"

            # Fail here rather than 200 lines later at the publish step. A token that is expired,
            # revoked, or scoped too narrowly is the single most likely bootstrap failure, and this
            # turns it into an obvious error before anything is built.
            - name: Verify the bootstrap token authenticates
              if: env.NPM_TOKEN != ''
              run: |
                  echo "Authenticated to npm as $(npm whoami)"

            # The one failure mode worth naming explicitly: a release fires at the package's creation
            # with no token to create it with. Left alone, npm reports this as an opaque auth error at
            # the very end of the job. One registry read turns it into an instruction.
            - name: Refuse to bootstrap over OIDC
              if: env.NPM_TOKEN == ''
              run: |
                  if ! npm view sentinello version > /dev/null 2>&1; then
                      echo "::error::sentinello does not exist on npm and no NPM_TOKEN secret is set. npm cannot CREATE a package over OIDC (npm/cli#8544); see the bootstrap note at the top of this workflow."
                      exit 1
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Keyed on the REF, not the event. release-please reaches this workflow by dispatching it
            # against the new tag, so an event-name check would send a real release down the
            # no-tag-in-sight branch and skip the cross-check below with it.
            - name: Resolve the release version
              id: version
              run: |
                  if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
                      VERSION="${GITHUB_REF_NAME#v}"
                  else
                      VERSION=$(node -p "require('./package.json').version")
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Publishing version $VERSION"

            # The tag is the source of truth on a release. If it disagrees with the root package.json,
            # release-please and the tag have diverged and the Docker image would ship different code
            # under the same number — fail loudly rather than publish a mismatched pair.
            - name: Verify the tag matches the root package.json
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  ROOT_VERSION=$(node -p "require('./package.json').version")
                  if [ "$ROOT_VERSION" != "${{ steps.version.outputs.version }}" ]; then
                      echo "::error::tag ${{ steps.version.outputs.version }} does not match root package.json $ROOT_VERSION"
                      exit 1
                  fi

            - name: Build the CLI bundle
              run: pnpm --filter sentinello build

            - name: Stamp the version onto the package
              working-directory: apps/cli
              run: npm pkg set version=${{ steps.version.outputs.version }}

            # The published package must declare no runtime dependencies: everything is bundled, and the
            # workspace packages it builds from are private and unpublishable. A stray `dependencies`
            # entry would produce a tarball that cannot install.
            - name: Verify the package is dependency-free
              working-directory: apps/cli
              run: |
                  DEPS=$(node -p "JSON.stringify(require('./package.json').dependencies || {})")
                  if [ "$DEPS" != "{}" ]; then
                      echo "::error::published package must have no runtime dependencies, found $DEPS"
                      exit 1
                  fi

            - name: Smoke-test the built binary
              working-directory: apps/cli
              run: |
                  node dist/cli.cjs --version
                  node dist/cli.cjs --help > /dev/null

            - name: Pack and inspect
              working-directory: apps/cli
              run: npm pack --dry-run

            - name: Publish
              if: github.event_name == 'push' || inputs.publish
              working-directory: apps/cli
              run: npm publish --access public --provenance
