# Pull-request gate. Everything else in .github/workflows fires on a tag or on main and is
# release machinery — this is the only workflow that gives a contributor feedback before merge.
#
# `pnpm install --frozen-lockfile` is load-bearing beyond reproducibility: it installs straight from
# the lockfile without a resolution pass, which is what keeps the `minimumReleaseAge` supply-chain
# guard (7 days, set in .npmrc and pnpm-workspace.yaml) from re-validating already-vetted transitive
# platform binaries and failing the build on a package nobody added.
name: ci

on:
    pull_request:
    push:
        branches: [main, develop]

# A force-push or a quick follow-up commit should cancel the superseded run rather than queue behind it.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        name: lint, typecheck, test, build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test:coverage

            - name: Upload coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage
                  path: coverage/
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Build
              run: pnpm build

    # The image is the primary artifact for every operator who is not using the CLI, and until 3.3.1
    # nothing built it before a tag was already cut. v3.3.0 shipped to npm and GitHub with no image on
    # either registry: the Dockerfile copies workspace manifests one by one before `pnpm install`, and
    # packages/versions was missing from that list, so it got no node_modules and the web build died on
    # its first bare import. Every job above was green for that commit and stayed green, because
    # `pnpm build` at the repo root installs the whole workspace and never exercises the subset the
    # image installs. Only building the image finds this.
    #
    # Deliberately NOT path-filtered. The tempting filter — Dockerfile plus the workspace manifests —
    # would have skipped the very commit that broke it: 4292629 added an `import` to
    # apps/web/lib/version.ts and touched nothing else. A missing manifest is latent until some source
    # file reaches for the package, so the trigger is an ordinary .ts edit anywhere in the image's
    # dependency graph. Any filter narrow enough to be worth having is narrow enough to miss it.
    #
    # amd64 only, and no push. The failure mode is architecture-independent (pnpm resolution, not
    # native compilation), so the second arch would double the cost to re-prove the same thing —
    # publish-image.yml still builds both on native runners at release time. The GHA cache scope is
    # separate from that workflow's so a PR can never poison the cache a release build reads.
    docker-image:
        name: container image builds
        runs-on: ubuntu-latest
        # A cold cache runs long (apt, better-sqlite3/sharp compiles, next build, nvm install); the
        # six-hour default would burn a runner rather than fail.
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v5

            - uses: docker/setup-buildx-action@v4

            - name: Build image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  push: false
                  # Never a real version — this image is thrown away and must not look publishable.
                  build-args: |
                      SENTINELLO_VERSION=ci
                  cache-from: type=gha,scope=ci-linux-amd64
                  cache-to: type=gha,mode=max,scope=ci-linux-amd64

    cli-e2e:
        name: cli end-to-end (node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # apps/cli/package.json publishes `engines: node >=22.0.0`, and this is the only job
                # that makes that claim true. Everything else here — the Dockerfile, .nvmrc, every
                # other job — pins 24, so without a 22 entry the floor we advertise to `npx sentinello`
                # users is never once executed. The CLI is the one artifact strangers run on a Node
                # version we do not control; raising the floor instead would drop users it works for
                # today (22 is maintenance LTS until April 2027). If this job ever fails, the honest
                # fix is to raise `engines`, not to delete the entry.
                node: [22, 24]
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Bundles the CLI and drives the real dist/cli.cjs as a subprocess — the same artifact
            # npm publishes. Catches packaging faults no in-process test can see.
            - name: CLI end-to-end
              run: pnpm test:e2e:cli

    portal-e2e:
        name: portal end-to-end
        runs-on: ubuntu-latest
        # Two next start processes plus a real worker means a hang is possible; the default ceiling
        # is six hours, which would burn a runner rather than fail.
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # pnpm blocks Playwright's post-install script (onlyBuiltDependencies in
            # pnpm-workspace.yaml lists only better-sqlite3, esbuild and sharp), so the browser has
            # to be fetched explicitly. Chromium only — the suite declares no other project.
            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium

            # Runs against a real production build served by `next start`, not the dev server. Must
            # stay ahead of the suite: tests/e2e/portal/build-guard.ts fails the run when .next is
            # older than the sources, so a missing build here is an error rather than a silent pass
            # against stale output.
            - name: Build
              run: pnpm build

            # Starts three processes of its own: a real apps/worker (so queued scans actually
            # complete), plus an open portal and a token-gated one. All of them are hermetic —
            # scanning goes through OSV against a hand-seeded local cache and every feed is off, so
            # nothing here reaches the network.
            - name: Portal end-to-end
              run: pnpm test:e2e

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
